resources:
  jobs:
    delivery360_pipeline:
      name: "[${bundle.target}] Delivery360 pipeline"
      description: "Incremental delivery pipeline: simulator, Bronze, Silver and Gold."
      performance_target: PERFORMANCE_OPTIMIZED
      tags:
        project: delivery360
        course: data-engineer-associate
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}
        - name: governance_schema
          default: ${var.governance_schema}
      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: "America/Costa_Rica"
        pause_status: PAUSED
      tasks:
        - task_key: simulate_batch
          notebook_task:
            notebook_path: ../src/notebooks/01_simulate_batch.py
            source: WORKSPACE
          max_retries: 1

        - task_key: bronze
          depends_on:
            - task_key: simulate_batch
          notebook_task:
            notebook_path: ../src/notebooks/02_bronze.py
            source: WORKSPACE
          max_retries: 2

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../src/notebooks/03_silver.py
            source: WORKSPACE

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/notebooks/04_gold.py
            source: WORKSPACE
