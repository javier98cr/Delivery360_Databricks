bundle:
  name: delivery360

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the project
    default: delivery360
  bronze_schema:
    default: bronze
  silver_schema:
    default: silver
  gold_schema:
    default: gold
  governance_schema:
    default: governance

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: delivery360
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    variables:
      catalog: delivery360
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
